<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Study Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style/site.css">
	
	<style>
	:root{--primary:#0f766e;--accent:#f2a541;--bg:#eef2f1;--surface:#fff;--text:#16282b;--muted:#5d6f72;--danger:#dc2626;--border:#d9e1e0;--side:#12343b;--r:10px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1819;--surface:#15272a;--text:#e4efee;--muted:#93a9ab;--border:#26403f;--primary:#2dd4bf;--side:#0a1213;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--primary)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{background:var(--side);color:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
header.top b{font-size:18px}
header.top nav{display:flex;gap:8px;align-items:center}
header.top a{color:#d5e6e4;text-decoration:none;padding:6px 10px}
.btn{display:inline-block;font:inherit;font-weight:600;background:var(--primary);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;text-decoration:none}
header.top .btn{background:var(--accent);color:#2a1a00}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{background:var(--side);color:#fff;padding:56px 0 72px}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.08;margin:0 0 16px}
.hero p{color:#c3d9d6;font-size:18px;max-width:46ch}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn.main{background:var(--accent);color:#2a1a00}
.demo{background:var(--surface);color:var(--text);border-radius:14px;padding:18px;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.demo h3{margin:0 0 12px;font-size:15px;color:var(--muted);font-weight:600}
.demo .it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.demo .it:first-of-type{border-top:0}
.demo small{display:block;color:var(--muted)}
.pill{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--border);white-space:nowrap;align-self:center}
.pill.hi{color:var(--danger);border-color:var(--danger)}
section.s{padding:56px 0}
section.s h2{font-size:30px;margin:0 0 8px}
section.s .lead{color:var(--muted);margin:0 0 28px;max-width:60ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.card h3{margin:0 0 6px;font-size:18px}.card p{margin:0;color:var(--muted)}
.loop{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.loop span{background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:8px 16px;font-weight:600}
.loop i{color:var(--muted);font-style:normal}
.soon .card{opacity:.75}
.cta{background:var(--side);color:#fff;text-align:center;padding:48px 20px}
.cta h2{margin:0 0 16px}
footer{padding:24px 0;color:var(--muted);font-size:14px;text-align:center}
/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.box{width:min(420px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px}
.box h1{font-size:24px;margin:0 0 4px}.box .sub{color:var(--muted);margin:0 0 18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:18px}
.tabs button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:8px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.15)}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:12px}
input{display:block;width:100%;font:inherit;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-top:4px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin:16px 0}
.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--border)}
#gbtn{display:flex;justify-content:center;min-height:44px}
.note{color:var(--muted);font-size:14px;margin:0;text-align:center}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:0 0 8px}
.back{display:block;text-align:center;margin-top:16px;font-size:14px}
@media(max-width:800px){.hero .wrap{grid-template-columns:1fr}}

	</style>
</head>
<body>
<main class="auth"><div class="box">
  <h1 id="title">Welcome back</h1>
  <p class="sub" id="sub">Log in to pick up where you left off.</p>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-login" aria-selected="true">Log in</button>
    <button role="tab" id="t-signup" aria-selected="false">Sign up</button>
  </div>

  <div id="gbtn"></div>
  <div class="or">or use your email</div>

  <form id="f" novalidate>
    <label id="nameRow" hidden>Name<input id="name" autocomplete="name"></label>
    <label>Email<input id="email" type="email" autocomplete="email" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" style="width:100%" id="go">Log in</button>
  </form>
  <a class="back" href="index.html">Back to home</a>
</div></main>

<script src="../scripts/auth.js"></script>
<script>
const $ = id => document.getElementById(id);
let mode = "login";
const go = () => location.href = Auth.CFG.appUrl;
if (Auth.user()) go();

function setMode(m) {
  mode = m;
  const su = m === "signup";
  $("t-login").setAttribute("aria-selected", !su);
  $("t-signup").setAttribute("aria-selected", su);
  $("nameRow").hidden = !su;
  $("title").textContent = su ? "Create your account" : "Welcome back";
  $("sub").textContent = su ? "Start planning your study in a minute." : "Log in to pick up where you left off.";
  $("go").textContent = su ? "Create account" : "Log in";
  $("pw").autocomplete = su ? "new-password" : "current-password";
  $("err").textContent = "";
}
$("t-login").onclick = () => setMode("login");
$("t-signup").onclick = () => setMode("signup");
if (new URLSearchParams(location.search).get("mode") === "signup") setMode("signup");

$("f").onsubmit = async e => {
  e.preventDefault();
  const email = $("email").value, pw = $("pw").value, name = $("name").value;
  if (!email.includes("@") || !pw) return $("err").textContent = "Enter your email and password.";
  if (mode === "signup" && !name.trim()) return $("err").textContent = "Enter your name.";
  $("go").disabled = true;
  try {
    mode === "signup" ? await Auth.signup(name, email, pw) : await Auth.login(email, pw);
    go();
  } catch (x) {
    $("err").textContent = x.message || "Something went wrong. Try again.";
    $("go").disabled = false;
  }
};

Auth.renderGoogle($("gbtn"), go, msg => $("err").textContent = msg);
</script>
</body>
</html>
