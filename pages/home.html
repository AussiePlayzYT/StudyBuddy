<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0f766e;--accent:#f2a541;--bg:#eef2f1;--surface:#fff;--text:#16282b;--muted:#5d6f72;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--border:#d9e1e0;--side:#12343b;--sidetext:#d5e6e4;--r:10px;--sh:0 1px 2px rgba(18,52,59,.08),0 4px 14px rgba(18,52,59,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1819;--surface:#15272a;--text:#e4efee;--muted:#93a9ab;--border:#26403f;--side:#0a1213;--primary:#2dd4bf;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1819;--surface:#15272a;--text:#e4efee;--muted:#93a9ab;--border:#26403f;--side:#0a1213;--primary:#2dd4bf;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--side);color:var(--sidetext);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:18px;margin:4px 10px 16px;color:#fff}
nav a{display:block;padding:8px 10px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.on{background:var(--accent);color:#2a1a00;font-weight:600}
nav a.soon{opacity:.55}
nav hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:10px 0}
main{padding:24px clamp(16px,3vw,36px);max-width:1100px;width:100%}
h2{font-size:26px;margin:0 0 4px}h3{margin:0 0 10px;font-size:17px}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.btn{font:inherit;font-weight:600;background:var(--primary);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn.sm{padding:4px 10px;font-size:13px}.btn.danger{background:var(--danger)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:10px;background:var(--border);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.ok i{background:var(--success)}
.muted{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--border);color:var(--muted)}
.tag.High{color:var(--danger);border-color:var(--danger)}.tag.Medium{color:var(--warning);border-color:var(--warning)}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.item:last-child{border:0}.item .grow{flex:1;min-width:0}
.done{text-decoration:line-through;color:var(--muted)}
.big{font-size:64px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:10px 0}
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px;min-height:140px;font-size:13px}
.day.today{border-color:var(--accent);border-width:2px}
.chip{display:block;background:var(--bg);border-left:3px solid var(--primary);padding:3px 6px;border-radius:4px;margin-top:4px}
.chip.t{border-color:var(--accent)}
dialog{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);color:var(--text);width:min(420px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
input,select{display:block;width:100%;font:inherit;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-top:3px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;display:none}
.empty{text-align:center;padding:36px 16px}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px}nav h1,nav hr{display:none}nav div{display:flex;gap:4px}nav a{white-space:nowrap;margin:0}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<div class="app">
<nav aria-label="Main"><h1>Study Platform</h1><div id="nav"></div></nav>
<main id="main" tabindex="-1"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
// ---------- Data layer (swap storage here later for a cloud DB) ----------
const KEY="study-platform-v1";
const blank=()=>({profile:{name:"Student",year:12,school:"",grad:2026,dailyGoal:120,weeklyGoal:10,studyMin:45,breakMin:10},subjects:[],tasks:[],sessions:[],goals:[]});
const DB={
  load(){try{const s=localStorage.getItem(KEY);if(s)return Object.assign(blank(),JSON.parse(s))}catch(e){}return blank()},
  save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
};
let S=DB.load();
const save=()=>DB.save();

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,8);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const TODAY=()=>iso(new Date());
const daysTo=s=>Math.round((new Date(s+"T00:00")-new Date(TODAY()+"T00:00"))/864e5);
const addDays=(s,n)=>{const d=new Date(s+"T00:00");d.setDate(d.getDate()+n);return iso(d)};
const monday=s=>{const d=new Date(s+"T00:00");d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const fmtD=s=>new Date(s+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
const hm=m=>m>=60?Math.floor(m/60)+"h "+(m%60)+"m":m+"m";
const subj=id=>S.subjects.find(s=>s.id===id);
const topic=(sid,tid)=>subj(sid)?.topics.find(t=>t.id===tid);
const label=(sid,tid)=>{const s=subj(sid);if(!s)return "General";const t=topic(sid,tid);return s.name+(t?" – "+t.name:"")};
const bar=(p,ok)=>`<div class="bar ${ok?"ok":""}" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,Math.max(0,p))}%"></i></div>`;
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2200)};
const mins=(from,to,sid)=>S.sessions.filter(x=>x.done&&x.date>=from&&x.date<=to&&(!sid||x.sid===sid)).reduce((a,x)=>a+(x.min||0),0);
const topicOpts=(withNone=true)=>{const o=withNone?[["","No subject"]]:[];S.subjects.forEach(s=>{o.push([s.id+":",s.name+" (general)"]);s.topics.forEach(t=>o.push([s.id+":"+t.id,s.name+" – "+t.name]))});return o};
const split=v=>{const [a,b]=(v||"").split(":");return{sid:a||"",tid:b||""}};
const subjProg=s=>s.topics.length?s.topics.reduce((a,t)=>a+t.conf*20,0)/s.topics.length:0;

function form(title,fields,cb){
  const d=$("#dlg");
  d.innerHTML=`<form method="dialog"><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.t==="select"
    ?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`
    :`<input name="${f.k}" type="${f.t||"text"}" value="${esc(f.v)}" ${f.r?"required":""} ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""}>`}</label>`).join("")}
    <div class="row"><button class="btn ghost" value="x" formnovalidate>Cancel</button><button class="btn" value="ok">Save</button></div></form>`;
  d.showModal();
  d.querySelector("form").onsubmit=e=>{if(e.submitter.value==="ok"){cb(Object.fromEntries(new FormData(e.target)));save();render()}};
}

// ---------- Recommendation engine (rule-based) ----------
function recommend(){
  const out=[];
  S.subjects.forEach(s=>{
    const ed=s.exam?daysTo(s.exam):null;
    s.topics.forEach(t=>{
      let sc=(5-t.conf)*8,why=[];
      if(t.conf<=2)why.push("Low confidence");
      if(t.quiz!=null&&t.quiz!==""&&t.quiz<60){sc+=20;why.push("Quiz average "+t.quiz+"%")}
      if(!t.last){sc+=10;why.push("Not studied yet")}
      else{const n=-daysTo(t.last);if(n>14){sc+=15;why.push("Not studied for "+n+" days")}}
      if(ed!=null&&ed>=0&&ed<=14){sc+=(15-ed)*2;why.push("Exam in "+ed+" day"+(ed===1?"":"s"))}
      S.tasks.filter(k=>!k.done&&k.tid===t.id&&daysTo(k.due)<=3).forEach(k=>{sc+=25+(k.pri==="High"?10:0);why.push(k.title+" due "+(daysTo(k.due)<0?"(overdue)":"in "+daysTo(k.due)+"d"))});
      out.push({sid:s.id,tid:t.id,sc,why,min:S.profile.studyMin});
    });
  });
  S.tasks.filter(k=>!k.done&&!k.tid&&daysTo(k.due)<=3).forEach(k=>out.push({sid:k.sid,tid:"",title:k.title,sc:25+(k.pri==="High"?10:0)-daysTo(k.due),why:["Due "+(daysTo(k.due)<0?"(overdue)":"in "+daysTo(k.due)+" days")],min:k.est||S.profile.studyMin}));
  return out.sort((a,b)=>b.sc-a.sc).slice(0,3);
}

// ---------- Timer ----------
const T={sid:"",tid:"",sess:"",total:S.profile.studyMin*60,left:S.profile.studyMin*60,run:false,iv:null};
const clock=()=>String(Math.floor(T.left/60)).padStart(2,"0")+":"+String(T.left%60).padStart(2,"0");
function tick(){if(!T.run)return;T.left--;if(T.left<=0){T.left=0;T.run=false;clearInterval(T.iv);toast("Time’s up. Finish the session to save it.");if($("#tbtn"))render();return}const e=$("#clock");if(e)e.textContent=clock()}
function startTimer(sid,tid,min,sess){clearInterval(T.iv);Object.assign(T,{sid,tid,sess:sess||"",total:min*60,left:min*60,run:false});if(location.hash==="#timer")render();else location.hash="timer"}

// ---------- Views ----------
const NAV=[["dashboard","Dashboard"],["planner","Planner"],["tasks","Tasks"],["subjects","Subjects"],["timer","Study timer"],["progress","Progress"],["goals","Goals"],["–"],["soon-notes","Notes"],["soon-quizzes","Quizzes"],["soon-flashcards","Flashcards"],["soon-ai","AI assistant"],["–"],["settings","Profile & settings"]];
const empty=(msg,btn)=>`<div class="card empty"><p>${msg}</p>${btn||""}</div>`;
const sampleBtn=`<button class="btn ghost" data-act="sample">Load sample data</button>`;
const taskRow=(k,extra="")=>`<div class="item"><input type="checkbox" style="width:auto;margin:0" data-act="toggle" data-id="${k.id}" ${k.done?"checked":""} aria-label="Complete ${esc(k.title)}"><div class="grow"><span class="${k.done?"done":""}">${esc(k.title)}</span><div class="muted">${esc(label(k.sid,k.tid))} · due ${fmtD(k.due)}${k.est?" · "+k.est+" min":""}</div></div><span class="tag ${k.pri}">${k.pri}</span>${extra}</div>`;

const V={
dashboard(){
  const p=S.profile,t=TODAY(),done=mins(t,t),pct=done/p.dailyGoal*100,h=new Date().getHours();
  const due=S.tasks.filter(k=>k.due<=t&&(!k.done||k.due===t)),exams=S.subjects.filter(s=>s.exam&&daysTo(s.exam)>=0).sort((a,b)=>a.exam<b.exam?-1:1);
  const up=S.tasks.filter(k=>!k.done&&k.due>t).sort((a,b)=>a.due<b.due?-1:1).slice(0,4);
  const rec=recommend();
  return `<h2>Good ${h<12?"morning":h<18?"afternoon":"evening"}, ${esc(p.name)}</h2><p class="sub">${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</p>
  ${!S.subjects.length?empty("Start by adding a subject, or explore with sample data.",`<button class="btn" data-act="addSubject">Add subject</button> ${sampleBtn}`)+"<br>":""}
  <div class="grid">
  <div class="card"><h3>Today’s progress</h3>${bar(pct,pct>=100)}<p class="muted">${done} / ${p.dailyGoal} minutes</p></div>
  <div class="card"><h3>Quick actions</h3><div class="row" style="justify-content:flex-start"><button class="btn sm" data-act="addTask">Add task</button><button class="btn sm" data-act="addSession">Add study session</button><button class="btn sm" data-act="addSubject">Add subject</button><a class="btn sm" href="#timer" style="text-decoration:none">Start timer</a></div></div>
  <div class="card"><h3>Today’s tasks</h3>${due.length?due.map(k=>taskRow(k)).join(""):'<p class="muted">Nothing due today.</p>'}</div>
  <div class="card"><h3>Upcoming</h3>${exams.slice(0,3).map(s=>`<div class="item"><div class="grow"><b>${esc(s.name)} exam</b></div><span class="tag">${daysTo(s.exam)} days</span></div>`).join("")}${up.map(k=>`<div class="item"><div class="grow">${esc(k.title)}</div><span class="tag">${daysTo(k.due)} days</span></div>`).join("")||(exams.length?"":'<p class="muted">Nothing coming up.</p>')}</div>
  <div class="card" style="grid-column:1/-1"><h3>Recommended study</h3>${rec.length?rec.map(r=>`<div class="item"><div class="grow"><b>${esc(r.title||label(r.sid,r.tid))}</b><div class="muted">${esc(r.why.join(" · ")||"Keep your revision ticking over")}</div></div><span class="muted">${r.min} min</span><button class="btn sm" data-act="rec" data-sid="${r.sid}" data-tid="${r.tid}" data-min="${r.min}">Start session</button></div>`).join(""):'<p class="muted">Add subjects with topics to get recommendations.</p>'}</div>
  </div>`;
},
planner(){
  const ws=addDays(monday(TODAY()),(V.off||0)*7),days=[...Array(7)].map((_,i)=>addDays(ws,i));
  return `<div class="row"><div><h2>Planner</h2><p class="sub">Week of ${fmtD(ws)}</p></div><div class="row"><button class="btn ghost sm" data-act="wk" data-n="-1">Previous</button><button class="btn ghost sm" data-act="wk" data-n="0">This week</button><button class="btn ghost sm" data-act="wk" data-n="1">Next</button><button class="btn sm" data-act="addSession">Add study session</button></div></div>
  <div class="week">${days.map(d=>`<div class="day ${d===TODAY()?"today":""}"><b>${new Date(d+"T00:00").toLocaleDateString(undefined,{weekday:"short"})} ${new Date(d+"T00:00").getDate()}</b>
  ${S.sessions.filter(x=>x.date===d).sort((a,b)=>(a.time||"")<(b.time||"")?-1:1).map(x=>`<span class="chip"><span class="${x.done?"done":""}">${esc(x.time||"")} ${esc(label(x.sid,x.tid))}</span><br><span class="muted">${x.done?x.min:x.dur} min</span> ${x.done?"":`<button class="btn sm" data-act="runSess" data-id="${x.id}">Start</button>`} <button class="btn ghost sm" data-act="delSess" data-id="${x.id}" aria-label="Delete session">×</button></span>`).join("")}
  ${S.tasks.filter(k=>k.due===d).map(k=>`<span class="chip t"><span class="${k.done?"done":""}">Due: ${esc(k.title)}</span></span>`).join("")}
  ${S.subjects.filter(s=>s.exam===d).map(s=>`<span class="chip t"><b>${esc(s.name)} exam</b></span>`).join("")}</div>`).join("")}</div>`;
},
tasks(){
  const t=[...S.tasks].sort((a,b)=>a.done-b.done||(a.due<b.due?-1:1)),od=S.tasks.filter(k=>!k.done&&daysTo(k.due)<0).length;
  return `<div class="row"><div><h2>Tasks</h2><p class="sub">${S.tasks.filter(k=>!k.done).length} to do${od?" · "+od+" overdue":""}</p></div><button class="btn" data-act="addTask">Add task</button></div>
  <div class="card">${t.length?t.map(k=>taskRow(k,`<button class="btn ghost sm" data-act="editTask" data-id="${k.id}">Edit</button><button class="btn ghost sm" data-act="delTask" data-id="${k.id}">Delete</button>`)).join(""):'<p class="muted">No tasks yet. Add your first one.</p>'}</div>`;
},
subjects(){
  return `<div class="row"><div><h2>Subjects</h2><p class="sub">Your subjects, topics and progress</p></div><button class="btn" data-act="addSubject">Add subject</button></div>
  ${S.subjects.length?`<div class="grid">${S.subjects.map(s=>{const p=subjProg(s);return `<div class="card" style="border-top:4px solid ${esc(s.color)}"><h3>${esc(s.name)}</h3><p class="muted">${s.topics.length} topics · ${S.tasks.filter(k=>k.sid===s.id&&!k.done).length} tasks open${s.target?" · target "+esc(s.target):""}</p>${bar(p)}<div class="row" style="margin-top:10px"><span class="muted">${Math.round(p)}% confidence</span><a class="btn sm" href="#subject-${s.id}" style="text-decoration:none">Open subject</a></div></div>`}).join("")}</div>`:empty("No subjects yet.",`<button class="btn" data-act="addSubject">Add subject</button> ${sampleBtn}`)}`;
},
subject(id){
  const s=subj(id);if(!s)return empty("Subject not found.");
  return `<div class="row"><div><h2>${esc(s.name)}</h2><p class="sub">${esc(s.teacher||"No teacher set")}${s.exam?" · exam "+fmtD(s.exam)+" ("+daysTo(s.exam)+" days)":""}${s.desc?" · "+esc(s.desc):""}</p></div><div class="row"><button class="btn ghost sm" data-act="editSubject" data-id="${s.id}">Edit</button><button class="btn danger sm" data-act="delSubject" data-id="${s.id}">Delete</button><button class="btn sm" data-act="addTopic" data-id="${s.id}">Add topic</button></div></div>
  <div class="card"><div class="muted" style="margin-bottom:8px">Overall ${Math.round(subjProg(s))}%</div>${bar(subjProg(s))}</div><br>
  <div class="card"><h3>Topics</h3>${s.topics.map(t=>`<div class="item"><div class="grow"><b>${esc(t.name)}</b><div class="muted">${esc(t.diff)} · last studied ${t.last?fmtD(t.last):"never"}${t.quiz!==""&&t.quiz!=null?" · quiz "+t.quiz+"%":""}</div>${bar(t.conf*20)}</div><span class="muted">${t.conf}/5</span><button class="btn ghost sm" data-act="editTopic" data-id="${s.id}" data-t="${t.id}">Edit</button><button class="btn ghost sm" data-act="delTopic" data-id="${s.id}" data-t="${t.id}">Delete</button><button class="btn sm" data-act="rec" data-sid="${s.id}" data-tid="${t.id}" data-min="${S.profile.studyMin}">Study</button></div>`).join("")||'<p class="muted">Add topics such as Algebra or Cells to track them.</p>'}</div><br>
  <div class="card"><h3>Open tasks</h3>${S.tasks.filter(k=>k.sid===s.id&&!k.done).map(k=>taskRow(k)).join("")||'<p class="muted">No open tasks.</p>'}</div>`;
},
timer(){
  const opts=topicOpts();
  return `<h2>Study timer</h2><p class="sub">Pick what you’re studying, then start.</p>
  <div class="card" style="max-width:480px"><label>Studying<select id="tsel">${opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===T.sid+":"+T.tid?"selected":""}>${esc(o[1])}</option>`).join("")}</select></label>
  <label>Minutes<input id="tmin" type="number" min="1" max="240" value="${Math.round(T.total/60)}" ${T.run||T.left<T.total?"disabled":""}></label>
  <div class="big" id="clock">${clock()}</div>
  ${bar(T.total?(1-T.left/T.total)*100:0)}
  <div class="row" style="margin-top:14px;justify-content:center" id="tbtn">${T.run?'<button class="btn" data-act="tpause">Pause</button>':`<button class="btn" data-act="tstart">${T.left<T.total?"Resume":"Start"}</button>`}<button class="btn ghost" data-act="tadd">Add 5 min</button><button class="btn ghost" data-act="treset">Reset</button><button class="btn ghost" data-act="tfinish">Finish session</button></div></div>`;
},
progress(){
  const all=S.sessions.filter(x=>x.done),tot=all.reduce((a,x)=>a+x.min,0),od=S.tasks.filter(k=>!k.done&&daysTo(k.due)<0).length;
  return `<h2>Progress</h2><p class="sub">Built from your sessions, tasks and topics</p>
  <div class="grid" style="margin-bottom:16px"><div class="card"><div class="muted">Total study time</div><h2>${hm(tot)}</h2></div><div class="card"><div class="muted">Sessions</div><h2>${all.length}</h2></div><div class="card"><div class="muted">Tasks completed</div><h2>${S.tasks.filter(k=>k.done).length}</h2></div><div class="card"><div class="muted">Tasks overdue</div><h2 style="color:${od?"var(--danger)":"inherit"}">${od}</h2></div></div>
  <div class="grid">${S.subjects.map(s=>{const m=mins("0000","9999",s.id),ts=S.tasks.filter(k=>k.sid===s.id),tp=ts.length?ts.filter(k=>k.done).length/ts.length*100:0;return `<div class="card"><h3 style="color:${esc(s.color)}">${esc(s.name)}</h3><div class="muted">Study time ${hm(m)}</div>${bar(Math.min(100,m/6))}<div class="muted" style="margin-top:8px">Tasks ${Math.round(tp)}%</div>${bar(tp)}<div class="muted" style="margin-top:8px">Topic progress ${Math.round(subjProg(s))}%</div>${bar(subjProg(s))}</div>`}).join("")||empty("Add subjects to see progress.")}</div>`;
},
goals(){
  const ws=monday(TODAY()),we=addDays(ws,6),wm=mins(ws,we),p=S.profile;
  const prog=g=>{if(g.type==="confidence"){const tp=topic(g.sid,g.tid);return{v:tp?tp.conf:0,t:g.target,u:" of 5 confidence"}}
    if(g.type==="sessions")return{v:S.sessions.filter(x=>x.done&&x.date>=ws&&x.date<=we&&(!g.sid||x.sid===g.sid)).length,t:g.target,u:" sessions"};
    return{v:Math.round(mins(ws,we,g.sid)/60*10)/10,t:g.target,u:" hours"}};
  return `<div class="row"><div><h2>Goals</h2><p class="sub">Weekly and subject goals</p></div><button class="btn" data-act="addGoal">Add goal</button></div>
  <div class="grid"><div class="card"><h3>Weekly study goal</h3>${bar(wm/(p.weeklyGoal*60)*100,wm>=p.weeklyGoal*60)}<p class="muted">${(wm/60).toFixed(1)} / ${p.weeklyGoal} hours</p></div>
  <div class="card"><h3>Daily study goal</h3>${bar(mins(TODAY(),TODAY())/p.dailyGoal*100)}<p class="muted">${mins(TODAY(),TODAY())} / ${p.dailyGoal} minutes today</p></div>
  ${S.goals.map(g=>{const r=prog(g);return `<div class="card"><div class="row"><h3>${esc(g.label)}</h3><button class="btn ghost sm" data-act="delGoal" data-id="${g.id}">Delete</button></div>${bar(r.v/r.t*100,r.v>=r.t)}<p class="muted">${r.v} / ${r.t}${r.u}</p></div>`}).join("")}</div>`;
},
settings(){
  const p=S.profile;
  return `<h2>Profile & settings</h2><p class="sub">Stored in this browser only</p>
  <div class="card" style="max-width:560px"><p><b>${esc(p.name)}</b> · Year ${p.year}${p.school?" · "+esc(p.school):""} · class of ${p.grad}</p><p class="muted">Daily goal ${p.dailyGoal} min · weekly ${p.weeklyGoal} h · sessions ${p.studyMin} min with ${p.breakMin} min breaks</p>
  <div class="row" style="justify-content:flex-start"><button class="btn" data-act="editProfile">Edit profile</button><button class="btn ghost" data-act="export">Export data</button><button class="btn ghost" data-act="sample">Load sample data</button><button class="btn danger" data-act="reset">Reset all data</button></div></div>`;
},
soon(n){return `<h2>${esc(n[0].toUpperCase()+n.slice(1))}</h2><div class="card empty"><p>This feature is currently under development. It’s planned for a later wave.</p></div>`}
};

// ---------- Router ----------
function render(){
  const r=location.hash.slice(1)||"dashboard",i=r.indexOf("-"),a=i<0?r:r.slice(0,i),rest=i<0?"":r.slice(i+1);
  const key=a==="subject"&&rest?"subject":a==="soon"?"soon":(V[a]?a:"dashboard");
  $("#nav").innerHTML=NAV.map(n=>n[0]==="–"?"<hr>":`<a href="#${n[0]}" class="${n[0]===r||(n[0]==="subjects"&&a==="subject")?"on":""} ${n[0].startsWith("soon")?"soon":""}" ${n[0]===r?'aria-current="page"':""}>${n[1]}</a>`).join("");
  $("#main").innerHTML=V[key](rest);
  document.title=(key[0].toUpperCase()+key.slice(1))+" · Study Platform";
}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});

// ---------- Forms ----------
const subjForm=(s,cb)=>form(s?"Edit subject":"Add subject",[{k:"name",l:"Subject name",r:1,v:s?.name},{k:"teacher",l:"Teacher",v:s?.teacher},{k:"color",l:"Colour",t:"color",v:s?.color||"#0f766e"},{k:"desc",l:"Description",v:s?.desc},{k:"target",l:"Target grade",v:s?.target},{k:"exam",l:"Exam date (optional)",t:"date",v:s?.exam}],cb);
const topicForm=(t,cb)=>form(t?"Edit topic":"Add topic",[{k:"name",l:"Topic name",r:1,v:t?.name},{k:"diff",l:"Difficulty",t:"select",o:["Easy","Medium","Hard"].map(x=>[x,x]),v:t?.diff||"Medium"},{k:"conf",l:"Confidence (1–5)",t:"number",min:1,max:5,v:t?.conf||2,r:1},{k:"quiz",l:"Quiz average % (optional)",t:"number",min:0,max:100,v:t?.quiz}],cb);
const taskForm=(k,cb)=>form(k?"Edit task":"Add task",[{k:"title",l:"Task",r:1,v:k?.title},{k:"on",l:"Subject / topic",t:"select",o:topicOpts(),v:k?k.sid+":"+k.tid:""},{k:"due",l:"Due date",t:"date",r:1,v:k?.due||TODAY()},{k:"pri",l:"Priority",t:"select",o:["High","Medium","Low"].map(x=>[x,x]),v:k?.pri||"Medium"},{k:"est",l:"Estimated minutes",t:"number",min:5,v:k?.est||30}],cb);

// ---------- Actions ----------
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,done=()=>{save();render()};
  const A={
    sample:()=>{if(S.subjects.length&&!confirm("Replace your current data with sample data?"))return;seed();toast("Sample data loaded")},
    reset:()=>{if(confirm("Delete all your data? This can’t be undone.")){S=blank();done()}},
    export:()=>{const l=document.createElement("a");l.href="data:application/json,"+encodeURIComponent(JSON.stringify(S,null,2));l.download="student-data.json";l.click()},
    editProfile:()=>form("Edit profile",[{k:"name",l:"Name",v:S.profile.name,r:1},{k:"year",l:"Year level",t:"number",v:S.profile.year},{k:"school",l:"School",v:S.profile.school},{k:"grad",l:"Graduation year",t:"number",v:S.profile.grad},{k:"dailyGoal",l:"Daily study goal (min)",t:"number",min:10,v:S.profile.dailyGoal},{k:"weeklyGoal",l:"Weekly study goal (hours)",t:"number",min:1,v:S.profile.weeklyGoal},{k:"studyMin",l:"Session length (min)",t:"number",min:5,v:S.profile.studyMin},{k:"breakMin",l:"Break length (min)",t:"number",min:1,v:S.profile.breakMin}],o=>{["year","grad","dailyGoal","weeklyGoal","studyMin","breakMin"].forEach(k=>o[k]=+o[k]);Object.assign(S.profile,o)}),
    addSubject:()=>subjForm(null,o=>S.subjects.push({id:uid(),topics:[],...o})),
    editSubject:()=>subjForm(subj(id),o=>Object.assign(subj(id),o)),
    delSubject:()=>{if(confirm("Delete this subject, its topics and tasks?")){S.subjects=S.subjects.filter(s=>s.id!==id);S.tasks=S.tasks.filter(k=>k.sid!==id);S.sessions=S.sessions.filter(k=>k.sid!==id);location.hash="subjects";done()}},
    addTopic:()=>topicForm(null,o=>subj(id).topics.push({id:uid(),name:o.name,diff:o.diff,conf:+o.conf,quiz:o.quiz===""?"":+o.quiz,last:""})),
    editTopic:()=>topicForm(topic(id,b.dataset.t),o=>Object.assign(topic(id,b.dataset.t),{name:o.name,diff:o.diff,conf:+o.conf,quiz:o.quiz===""?"":+o.quiz})),
    delTopic:()=>{const s=subj(id);s.topics=s.topics.filter(t=>t.id!==b.dataset.t);done()},
    addTask:()=>taskForm(null,o=>S.tasks.push({id:uid(),title:o.title,...split(o.on),due:o.due,pri:o.pri,est:+o.est,done:false})),
    editTask:()=>{const k=S.tasks.find(x=>x.id===id);taskForm(k,o=>Object.assign(k,{title:o.title,...split(o.on),due:o.due,pri:o.pri,est:+o.est}))},
    delTask:()=>{S.tasks=S.tasks.filter(k=>k.id!==id);done()},
    toggle:()=>{const k=S.tasks.find(x=>x.id===id);k.done=!k.done;done()},
    addSession:()=>form("Add study session",[{k:"on",l:"Subject / topic",t:"select",o:topicOpts(),v:""},{k:"date",l:"Date",t:"date",r:1,v:TODAY()},{k:"time",l:"Time",t:"time",v:"16:00"},{k:"dur",l:"Duration (min)",t:"number",min:5,v:S.profile.studyMin}],o=>S.sessions.push({id:uid(),...split(o.on),date:o.date,time:o.time,dur:+o.dur,done:false})),
    delSess:()=>{S.sessions=S.sessions.filter(x=>x.id!==id);done()},
    runSess:()=>{const x=S.sessions.find(s=>s.id===id);startTimer(x.sid,x.tid,x.dur,x.id)},
    rec:()=>startTimer(b.dataset.sid,b.dataset.tid,+b.dataset.min),
    wk:()=>{V.off=+b.dataset.n===0?0:(V.off||0)+ +b.dataset.n;render()},
    addGoal:()=>form("Add goal",[{k:"type",l:"Type",t:"select",o:[["minutes","Weekly study hours"],["sessions","Weekly sessions"],["confidence","Topic confidence"]],v:"minutes"},{k:"on",l:"Subject / topic (a topic is needed for confidence goals)",t:"select",o:topicOpts(),v:""},{k:"target",l:"Target (hours, sessions or 1–5)",t:"number",min:1,r:1,v:5}],o=>{const p=split(o.on),n=label(p.sid,p.tid);S.goals.push({id:uid(),type:o.type,...p,target:+o.target,label:o.type==="confidence"?"Reach "+o.target+"/5 in "+n:o.type==="sessions"?"Complete "+o.target+(p.sid?" "+n:"")+" sessions this week":"Study "+o.target+"h"+(p.sid?" of "+n:"")+" this week"})}),
    delGoal:()=>{S.goals=S.goals.filter(g=>g.id!==id);done()},
    tstart:()=>{const v=split($("#tsel").value);if(T.left===T.total){T.total=T.left=Math.max(1,+$("#tmin").value)*60}Object.assign(T,v,{run:true});clearInterval(T.iv);T.iv=setInterval(tick,1000);render()},
    tpause:()=>{T.run=false;clearInterval(T.iv);render()},
    tadd:()=>{T.total+=300;T.left+=300;render()},
    treset:()=>{T.run=false;clearInterval(T.iv);T.left=T.total;render()},
    tfinish:()=>{Object.assign(T,split($("#tsel").value));T.run=false;clearInterval(T.iv);const m=Math.max(1,Math.round((T.total-T.left)/60));
      form("Session complete: "+m+" min",[{k:"r",l:"How productive were you? (1–5)",t:"select",o:[5,4,3,2,1].map(x=>[x,x]),v:4}],o=>{
        const x=T.sess&&S.sessions.find(s=>s.id===T.sess);
        if(x)Object.assign(x,{done:true,min:m,rating:+o.r});else S.sessions.push({id:uid(),sid:T.sid,tid:T.tid,date:TODAY(),time:"",dur:m,min:m,done:true,rating:+o.r});
        const t=topic(T.sid,T.tid);if(t)t.last=TODAY();
        Object.assign(T,{sess:"",total:S.profile.studyMin*60,left:S.profile.studyMin*60});toast("Session saved");location.hash="progress"})}
  };
  A[a]&&A[a]();
});
document.addEventListener("change",e=>{
  if(e.target.id==="tmin"&&!T.run){T.total=T.left=Math.max(1,+e.target.value)*60;$("#clock").textContent=clock()}
  if(e.target.id==="tsel")Object.assign(T,split(e.target.value));
});

function seed(){
  const d=n=>addDays(TODAY(),n),tp=(name,conf,diff,quiz,last)=>({id:uid(),name,conf,diff,quiz,last});
  const m={id:"math",name:"Mathematics",teacher:"Ms Chen",color:"#0f766e",desc:"Year 12 Advanced",target:"90%",exam:d(6),topics:[tp("Algebra",2,"Hard",48,d(-16)),tp("Functions",3,"Medium",65,d(-4)),tp("Trigonometry",3,"Medium","",d(-9)),tp("Statistics",4,"Easy",82,d(-3))]};
  const e={id:"eng",name:"English",teacher:"Mr Okafor",color:"#c2410c",desc:"Essay writing",target:"A",exam:"",topics:[tp("Essay structure",3,"Medium","",d(-5)),tp("Poetry analysis",2,"Hard",55,"")]};
  const b={id:"bio",name:"Biology",teacher:"Dr Patel",color:"#4d7c0f",desc:"Cells and genetics",target:"85%",exam:d(20),topics:[tp("Cells",5,"Easy",91,d(-2)),tp("Genetics",3,"Hard",70,d(-10))]};
  S=blank();S.subjects=[m,e,b];
  S.tasks=[{id:uid(),title:"Algebra worksheet",sid:"math",tid:m.topics[0].id,due:d(1),pri:"High",est:45,done:false},{id:uid(),title:"English essay draft",sid:"eng",tid:"",due:d(2),pri:"Medium",est:60,done:false},{id:uid(),title:"Biology revision",sid:"bio",tid:b.topics[0].id,due:TODAY(),pri:"Low",est:20,done:true}];
  S.sessions=[{id:uid(),sid:"math",tid:m.topics[1].id,date:TODAY(),time:"16:00",dur:45,min:45,done:true,rating:4},{id:uid(),sid:"bio",tid:b.topics[1].id,date:d(1),time:"17:00",dur:30,done:false},{id:uid(),sid:"math",tid:m.topics[0].id,date:d(2),time:"16:00",dur:45,done:false}];
  S.goals=[{id:uid(),type:"confidence",sid:"math",tid:m.topics[0].id,target:4,label:"Reach 4/5 in Mathematics – Algebra"},{id:uid(),type:"sessions",sid:"math",tid:"",target:5,label:"Complete 5 Mathematics sessions this week"}];
  save();render();
}
render();
</script>
</body>
</html>
