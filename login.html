<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Study Platform</title>
<meta name="color-scheme" content="light dark">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<main class="auth"><div class="box">
  <h1 id="title">Welcome back</h1>
  <p class="sub" id="sub">Log in to pick up where you left off.</p>

  <div class="tabs" role="tablist" aria-label="Log in or sign up">
    <button type="button" role="tab" id="t-login" aria-selected="true" aria-controls="f">Log in</button>
    <button type="button" role="tab" id="t-signup" aria-selected="false" aria-controls="f">Sign up</button>
  </div>

  <form id="f" role="tabpanel" novalidate>
    <label id="nameRow" hidden>Name<input id="name" autocomplete="name" maxlength="60"></label>
    <label>Email<input id="email" type="email" autocomplete="email" required></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
    <label class="chk"><input type="checkbox" id="show"> Show password</label>
    <label class="chk"><input type="checkbox" id="rem" checked> Keep me signed in on this device</label>
    <p class="err" id="err" role="alert"></p>
    <button class="btn" style="width:100%" id="go">Log in</button>
  </form>
  
<div class="google-divider"><span>or</span></div>

<div id="googleSignIn" class="google-signin"></div>
<p class="err" id="googleErr" role="alert"></p>

<button type="button" class="btn ghost guest" id="guest">
  Continue as a guest
</button>

  <a class="back" href="index.html">Back to home</a>
</div></main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/auth.js"></script>

<script>
const $ = id => document.getElementById(id);

const GOOGLE_CLIENT_ID =
  "975102357812-e3osguv8vvokagfprs19f9j9h0jjd6nv.apps.googleusercontent.com";

let mode = "login";

const go = () => {
  location.href = Auth.CFG.appUrl;
};

if (Auth.user()) {
  go();
}

function setMode(m) {
  mode = m;

  const su = m === "signup";

  $("t-login").setAttribute("aria-selected", String(!su));
  $("t-signup").setAttribute("aria-selected", String(su));

  $("nameRow").hidden = !su;

  $("title").textContent = su
    ? "Create your account"
    : "Welcome back";

  $("sub").textContent = su
    ? "Start planning your study in a minute."
    : "Log in to pick up where you left off.";

  $("go").textContent = su ? "Create account" : "Log in";
  $("pw").autocomplete = su ? "new-password" : "current-password";

  document.title = (su ? "Sign up" : "Log in") + " · Study Platform";

  $("err").textContent = "";
}

$("t-login").onclick = () => setMode("login");
$("t-signup").onclick = () => setMode("signup");

$("show").onchange = () => {
  $("pw").type = $("show").checked ? "text" : "password";
};

if (new URLSearchParams(location.search).get("mode") === "signup") {
  setMode("signup");
}

// Email and password authentication
$("f").onsubmit = async e => {
  e.preventDefault();

  const email = $("email").value;
  const pw = $("pw").value;
  const name = $("name").value;
  const rem = $("rem").checked;

  if (!email.trim() || !pw) {
    $("err").textContent = "Enter your email and password.";
    return;
  }

  $("go").disabled = true;
  $("err").textContent = "";

  try {
    if (mode === "signup") {
      await Auth.signup(name, email, pw, rem);
    } else {
      await Auth.login(email, pw, rem);
    }

    go();
  } catch (x) {
    $("err").textContent =
      x.message || "Something went wrong. Try again.";

    $("go").disabled = false;
  }
};

// Google sign-in
function decodeGoogleCredential(credential) {
  const parts = credential.split(".");

  if (parts.length !== 3) {
    throw new Error("Invalid Google credential.");
  }

  const payload = parts[1]
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const padded = payload.padEnd(
    payload.length + (4 - payload.length % 4) % 4,
    "="
  );

  const bytes = Uint8Array.from(
    atob(padded),
    c => c.charCodeAt(0)
  );

  return JSON.parse(new TextDecoder().decode(bytes));
}

function handleGoogleResponse(response) {
  const error = $("googleErr");

  if (error) error.textContent = "";

  try {
    const profile = decodeGoogleCredential(response.credential);

    // This browser-side check is not a substitute for
    // server-side Google ID-token verification.
    if (
      !profile.sub ||
      !profile.email ||
      profile.email_verified !== true
    ) {
      throw new Error(
        "Google could not verify your account details."
      );
    }

    Auth.googleLogin(
      {
        id: profile.sub,
        name: profile.name || profile.email.split("@")[0],
        email: profile.email
      },
      $("rem").checked
    ).then(() => {
      go();
    }).catch(x => {
      if (error) {
        error.textContent =
          x.message || "Google sign-in failed. Please try again.";
      }
    });
  } catch (x) {
    if (error) {
      error.textContent =
        x.message || "Google sign-in failed. Please try again.";
    }
  }
}

function initialiseGoogleSignIn() {
  const container = $("googleSignIn");

  if (!container) {
    console.error(
      'Google sign-in container "#googleSignIn" was not found.'
    );
    return;
  }

  if (!window.google?.accounts?.id) {
    // The Google Identity Services script may still be loading.
    setTimeout(initialiseGoogleSignIn, 250);
    return;
  }

  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleResponse
  });

  container.innerHTML = "";

  google.accounts.id.renderButton(container, {
    type: "standard",
    theme: "outline",
    size: "large",
    text: "continue_with",
    shape: "rectangular",
    logo_alignment: "left",
    width: Math.min(container.clientWidth || 320, 400)
  });
}

// Guest access
$("guest").onclick = () => {
  try {
    Auth.guest();
    go();
  } catch (x) {
    $("err").textContent = x.message;
  }
};

// Start Google sign-in once the page has loaded.
initialiseGoogleSignIn();
</script>

</body>
</html>
